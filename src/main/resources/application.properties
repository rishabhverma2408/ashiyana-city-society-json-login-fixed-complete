spring.application.name=society-management
server.port=${PORT:10000}
server.servlet.session.timeout=7d
spring.web.resources.cache.period=0

server.servlet.session.cookie.max-age=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Local/dev uses ./data JSON files.
# On Render free, set DATABASE_URL to a free Neon Postgres connection string
# so member/payment/expense data survives restarts.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

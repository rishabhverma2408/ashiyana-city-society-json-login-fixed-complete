<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Society Expenses</title>
<style>
body{font-family:Arial;background:#f4f6f8;margin:0;color:#222}header{background:#17324d;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:15px}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}.expense{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0}button,input{padding:10px 14px;border:0;border-radius:7px;background:#17324d;color:#fff;cursor:pointer}label{display:block;margin:14px 0 6px;font-weight:bold}input{background:#fff;color:#222;border:1px solid #ccc;margin-left:8px}.small{color:#555;font-size:13px}
</style>
</head>
<body>
<header><h1>Society Expenses Details</h1><div>Ashiyana City I Society</div></header>
<main>
<button onclick="location.href='/'">← Back</button>
<div class="card">
 <label>View expenses for month <input id="expenseMonth" type="month" onchange="render()"></label>
 <div class="small" id="viewNote"></div>
</div>
<div id="summary" class="card">Loading...</div>
<div id="list"></div>
</main>
<script>
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const e=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
let expenses=[];
const currentMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};

function render(){
 const month=document.getElementById('expenseMonth').value||currentMonth();
 const isCurrent=month===currentMonth();
 let records=expenses.filter(x=>String(x.expenseDate||'').startsWith(month))
  .sort((a,b)=>String(b.expenseDate).localeCompare(String(a.expenseDate))||Number(b.id)-Number(a.id));
 const total=records.reduce((sum,x)=>sum+Number(x.amount||0),0);
 if(isCurrent)records=records.slice(0,10);
 document.getElementById('viewNote').textContent=isCurrent?'Showing the latest 10 current-month expenses. Choose another month to see all of its records.':'Showing all records for the selected month.';
 document.getElementById('summary').innerHTML='<b>Expenses:</b> '+money(total)+' &nbsp; <b>Entries shown:</b> '+records.length;
 document.getElementById('list').innerHTML=records.length?records.map(x=>'<div class="expense"><b>'+e(x.expenseDate)+' — '+e(x.category)+'</b><br>'+e(x.description||'-')+'<br><b>'+money(x.amount)+'</b>'+(x.paidTo?' — Paid To: '+e(x.paidTo):'')+'</div>').join(''):'<div class="card">No expenses found for this month.</div>';
}

async function load(){
 const me=await fetch('/api/auth/me').then(r=>r.json());
 if(!me.authenticated){location.href='/';return}
 expenses=await fetch('/api/expenses').then(r=>r.json());
 document.getElementById('expenseMonth').value=currentMonth();
 render();
}
load().catch(()=>location.href='/');
</script>
</body>
</html>

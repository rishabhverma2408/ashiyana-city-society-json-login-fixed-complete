<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Society Members</title><style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#222}header{background:#17324d;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:15px}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}.member{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button{padding:10px 14px;border:0;border-radius:7px;background:#17324d;color:#fff;cursor:pointer}.secret{margin-top:8px;color:#17324d;font-weight:bold}.edit,.reset{margin-top:10px;background:#6c757d}.delete{margin-top:10px;margin-left:6px;background:#dc3545}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>Society Members Details</h1><div>Ashiyana City I Society</div></header><main><button onclick="location.href='/'">← Back</button><div id="summary" class="card">Loading...</div><div id="list"></div></main><script>const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const e=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');let members=[];async function load(){const me=await fetch('/api/auth/me').then(r=>r.json());if(!me.authenticated){location.href='/';return}const r=await fetch('/api/residents');const ms=await r.json();members=ms;const admin=me.role==='ADMIN';const canEdit=admin||me.role==='SECRETARY';const canReset=canEdit;document.getElementById('summary').innerHTML='<b>Total Members:</b> '+ms.length;document.getElementById('list').innerHTML=ms.map(x=>'<div class="member"><b>Flat: '+e(x.flatNumber)+'</b><h3>'+e(x.memberName)+'</h3><div>Phone: '+e(x.phoneNumber)+'</div><div>Email: '+e(x.email||'-')+'</div><div>Monthly Contribution: '+money(x.expectedAmount)+'</div>'+(admin?'<div class="secret">Secret Code: '+e(x.secretCode||'-')+'</div>':'')+(canEdit?'<button class="edit" onclick="editMember('+Number(x.id)+')">Edit Member</button>':'')+(canReset?'<button class="reset" onclick="resetMemberPassword('+Number(x.id)+')">Reset Password</button>':'')+(admin?'<button class="delete" onclick="deleteMember('+Number(x.id)+')">Delete Member</button>':'')+'</div>').join('')}async function editMember(id){const x=members.find(m=>Number(m.id)===Number(id));const flat=prompt('Flat Number',x.flatNumber);if(flat===null)return;const name=prompt('Member Name',x.memberName);if(name===null)return;const phone=prompt('Phone Number',x.phoneNumber);if(phone===null)return;const email=prompt('Email',x.email||'');if(email===null)return;const contribution=prompt('Monthly Contribution',x.expectedAmount);if(contribution===null)return;const r=await fetch('/api/residents/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({flatNumber:flat,memberName:name,phoneNumber:phone,email,expectedAmount:Number(contribution)})});const result=await r.json();if(!r.ok){alert(result.error||result.message||'Update failed');return}await load()}async function resetMemberPassword(id){const password=prompt('Enter a new password (6-15 characters):');if(password===null)return;if(password.length<6||password.length>15){alert('Password must be between 6 and 15 characters');return}const r=await fetch('/api/residents/'+id+'/password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const x=await r.json();alert(r.ok?(x.message||'Password reset successfully'):(x.error||x.message||'Password reset failed'))}async function deleteMember(id){if(!confirm('Delete this member? This cannot be undone.'))return;const r=await fetch('/api/residents/'+id,{method:'DELETE'});const x=await r.json();if(!r.ok){alert(x.error||x.message||'Could not delete member');return}await load()}load().catch(()=>location.href='/');</script></body></html>
